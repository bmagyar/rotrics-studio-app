services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
